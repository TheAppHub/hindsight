AWSTemplateFormatVersion: "2010-09-09"
Description: "Contact Form Lambda Function with API Gateway"

Parameters:
  FromEmail:
    Type: String
    Description: "Email address to send from (must be verified in SES)"
    Default: "website@hindsight.com.au"

  ToEmail:
    Type: String
    Description: "Email address to receive contact form submissions"
    Default: "christoph@hindsight.com.au"

Resources:
  # Lambda Function
  ContactFormFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: hindsight-contact-form-handler
      Runtime: nodejs18.x
      Handler: hindsight-contact-form-handler.handler
      Role: !GetAtt LambdaExecutionRole.Arn
      Code:
        ZipFile: |
          const AWS = require('aws-sdk');

          const ses = new AWS.SES({
            region: process.env.AWS_REGION || 'ap-southeast-2'
          });

          const ALLOWED_ORIGINS = [
            'http://localhost:4000', 
            'https://hindsight.com.au'
          ];

          const REQUIRED_FIELDS = ['name', 'email', 'subject', 'message'];

          function getCorsHeaders(origin) {
            const allowedOrigin = ALLOWED_ORIGINS.includes(origin) ? origin : '';
            return {
              'Access-Control-Allow-Origin': allowedOrigin,
              'Access-Control-Allow-Headers': 'Content-Type',
              'Access-Control-Allow-Methods': 'POST, OPTIONS'
            };
          }

          exports.handler = async (event) => {
            const origin = event.headers?.origin || '';

            if (event.httpMethod === 'OPTIONS') {
              return {
                statusCode: 200,
                headers: getCorsHeaders(origin),
                body: ''
              };
            }
            
            try {
              if (!event.body) {
                console.warn('No body in request');
                return {
                  statusCode: 400,
                  headers: getCorsHeaders(origin),
                  body: JSON.stringify({ message: 'Missing request body' })
                };
              }

              const data = JSON.parse(event.body);

              const missingFields = REQUIRED_FIELDS.filter((field) => !data[field]);
              if (missingFields.length > 0) {
                console.warn('Missing required fields:', missingFields);
                return {
                  statusCode: 400,
                  headers: getCorsHeaders(origin),
                  body: JSON.stringify({
                    message: `Missing required fields: ${missingFields.join(', ')}`
                  })
                };
              }
              
              const params = {
                Source: '${FromEmail}',
                Destination: {
                  ToAddresses: ['${ToEmail}']
                },
                Message: {
                  Subject: {
                    Data: `New Contact Form Submission: ${data.subject}`,
                    Charset: 'UTF-8'
                  },
                  Body: {
                    Text: {
                      Data: `Name: ${data.name}\nEmail: ${data.email}\nSubject: ${data.subject}\n\nMessage:\n${data.message}\n\n---\nThis message was sent from your website contact form.`,
                      Charset: 'UTF-8'
                    },
                    Html: {
                      Data: `<h2>New Contact Form Submission</h2><p><strong>Name:</strong> ${data.name}</p><p><strong>Email:</strong> ${data.email}</p><p><strong>Subject:</strong> ${data.subject}</p><p><strong>Message:</strong></p><p>${data.message.replace(/\n/g, '<br>')}</p><hr><p><em>This message was sent from your website contact form.</em></p>`,
                      Charset: 'UTF-8'
                    }
                  }
                }
              };
              
              await ses.sendEmail(params).promise();
              
              console.log('Form submission successful');
              return {
                statusCode: 200,
                headers: getCorsHeaders(origin),
                body: JSON.stringify({ message: 'Form submitted successfully!' })
              };
              
            } catch (error) {
              console.error('Unexpected error in Lambda:', error);
              return {
                statusCode: 500,
                headers: getCorsHeaders(origin),
                body: JSON.stringify({ message: 'Error processing form.' })
              };
            }
          };
      Environment:
        Variables:
          FROM_EMAIL: !Ref FromEmail
          TO_EMAIL: !Ref ToEmail
      Timeout: 30

  # IAM Role for Lambda
  LambdaExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: SESPolicy
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - ses:SendEmail
                  - ses:SendRawEmail
                Resource: "*"

  # API Gateway
  ApiGateway:
    Type: AWS::ApiGateway::RestApi
    Properties:
      Name: hindsight-contact-form-api
      Description: "API Gateway for contact form Lambda function"

  # API Gateway Resource
  ApiResource:
    Type: AWS::ApiGateway::Resource
    Properties:
      RestApiId: !Ref ApiGateway
      ParentId: !GetAtt ApiGateway.RootResourceId
      PathPart: contact

  # API Gateway POST Method
  ApiMethod:
    Type: AWS::ApiGateway::Method
    Properties:
      RestApiId: !Ref ApiGateway
      ResourceId: !Ref ApiResource
      HttpMethod: POST
      AuthorizationType: NONE
      Integration:
        Type: AWS_PROXY
        IntegrationHttpMethod: POST
        Uri: !Sub "arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${ContactFormFunction.Arn}/invocations"

  # API Gateway OPTIONS Method (MOCK for CORS)
  ApiOptionsMethod:
    Type: AWS::ApiGateway::Method
    Properties:
      RestApiId: !Ref ApiGateway
      ResourceId: !Ref ApiResource
      HttpMethod: OPTIONS
      AuthorizationType: NONE
      Integration:
        Type: MOCK
        RequestTemplates:
          application/json: '{"statusCode": 200}'
        IntegrationResponses:
          - StatusCode: 200
            ResponseParameters:
              method.response.header.Access-Control-Allow-Headers: "'Content-Type'"
              method.response.header.Access-Control-Allow-Methods: "'OPTIONS,POST'"
              method.response.header.Access-Control-Allow-Origin: "'https://hindsight.com.au'"
            ResponseTemplates:
              application/json: ""
      MethodResponses:
        - StatusCode: 200
          ResponseParameters:
            method.response.header.Access-Control-Allow-Headers: true
            method.response.header.Access-Control-Allow-Methods: true
            method.response.header.Access-Control-Allow-Origin: true
          ResponseModels:
            application/json: "Empty"

  # API Gateway Deployment
  ApiDeployment:
    Type: AWS::ApiGateway::Deployment
    DependsOn:
      - ApiMethod
      - ApiOptionsMethod
    Properties:
      RestApiId: !Ref ApiGateway
      StageName: prod
      Description: "Deployment with CORS support"
      DeploymentId: "cors-deployment-1"

  # Lambda Permission for API Gateway
  LambdaPermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref ContactFormFunction
      Action: lambda:InvokeFunction
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub "arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${ApiGateway}/*/*/contact"

Outputs:
  ApiEndpoint:
    Description: "API Gateway endpoint URL"
    Value: !Sub "https://${ApiGateway}.execute-api.${AWS::Region}.amazonaws.com/prod/contact"
    Export:
      Name: !Sub "${AWS::StackName}-ApiEndpoint"
