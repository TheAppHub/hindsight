core_services:
  heading: What we offer
  intro: We combine strategic thinking with sharp creative to deliver digital marketing that drives traffic, builds trust and supports long-term growth.
  services:
    - title: Digital Strategy
      description: We build clear, actionable strategies tailored to your brand, audience and goals — covering content, platforms and the roadmap to get you there.
      icon: /icons/strategy.svg
    - title: Paid Advertising
      description: Across Google, Meta and LinkedIn, we create targeted ad campaigns that capture attention, drive traffic and deliver real results.
      icon: /icons/paid-advertising.svg
    - title: Email & EDM Campaigns
      description: Our email marketing is designed to engage — with smart segmentation, strong creative and strategies that drive clicks and conversions.
      icon: /icons/inbox-management.svg
    - title: Content Marketing
      description: From blogs and landing pages to lead magnets, we create content that informs, converts and aligns with your broader strategy.
      icon: /icons/copy-writing.svg
    - title: UX & Conversion Design
      description: We design user experiences that are intuitive, engaging and conversion-focused, ensuring your digital touchpoints drive results.
      icon: /icons/custom-design.svg
    - title: Analytics & Reporting
      description: Clear insights, smart recommendations and performance tracking that helps you scale what’s working and refine what’s not.
      icon: /icons/analytics.svg


